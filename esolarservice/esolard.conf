#define ESOLARD_VERSION "1.3.5-ha1"

# /etc/esolard.conf - settings for esolard (eSolar on Linux)
#
# key = value, one per line. Lines starting with # are comments.
# After a change:  sudo systemctl reload esolard   (or Restart on the setup page)
# This file holds the SQL password: keep it readable by root only (sudo chmod 600 /etc/esolard.conf).

# ---- Inverter (SolarEdge leader, Modbus TCP must be enabled in SetApp) ----
inverter_host = <your inverter address>
inverter_port = 1502
# time between two readings, 5 .. 3600 s
poll_seconds = 10

# ---- Web page and /json ----
http_port = 80
http_bind = 0.0.0.0

# ---- Data: day totals, chart days (hist/), SQL rows waiting to be written ----
data_dir = /var/lib/esolar
# previous days of the chart kept
hist_keep_days = 366

# Time zone for midnight, the day totals and the chart (empty = the machine's own)
timezone = Europe/Brussels

# ---- Weather (Open-Meteo) on the dashboard: your location, empty = only sun / moon ----
latitude = <your latitude>
longitude = <your longitude>

# ---- MySQL / MariaDB logging ----
sql_active = yes
sql_server = <your mysql database server>
sql_port = 3306
# daily totals (time DATE, daypower, exported, imported, consumption; Wh)
sql_table = esolaredge.power
# 5-minute rows (time UTC, solar, battery, grid, voltage_l1..3, production, battery_level)
sql_log_table = esolaredge.powerlog
sql_user = <your user>
sql_password = <your password>
# also write the weather in the 5-minute rows. Add the columns first (else rows are refused and wait):
#   ALTER TABLE esolaredge.powerlog
#     ADD COLUMN `temperature`  DECIMAL(4,1) NULL COMMENT 'C, outside temperature (Open-Meteo)',
#     ADD COLUMN `weather_code` SMALLINT     NULL COMMENT 'WMO weather code',
#     ADD COLUMN `weather`      VARCHAR(16)  NULL COMMENT 'Clear, Partly cloudy, Rain, ...';
sql_weather = yes
# also write the Production & consumption card in the daily row (Wh). Add the columns first:
#   ALTER TABLE esolaredge.power
#     ADD COLUMN `to_home`      INT NULL COMMENT 'Wh, production used by the house',
#     ADD COLUMN `to_battery`   INT NULL COMMENT 'Wh, production stored in the battery',
#     ADD COLUMN `to_grid`      INT NULL COMMENT 'Wh, production sent to the grid',
#     ADD COLUMN `from_solar`   INT NULL COMMENT 'Wh, house use from solar (= to_home)',
#     ADD COLUMN `from_battery` INT NULL COMMENT 'Wh, house use from the battery',
#     ADD COLUMN `from_grid`    INT NULL COMMENT 'Wh, house use from the grid';
# Then set this to yes, and once, for the days already kept:  sudo esolard -F
sql_daily_split = yes
# also write the voltage deviation from 230 V in the 5-minute rows (add the columns first)
sql_voltage_tol = yes
# ---- Log ----
# Every line also goes to this file, with date and time (empty = only the system journal).
# A service may not write directly in /var/log, so it has its own folder /var/log/esolar.
log_file = /var/log/esolar/esolar.log
# when the file is larger than this (MB) it becomes esolar.log.1 (.1 -> .2 ...); this many old files are kept
log_max_mb = 5
log_keep = 5
# log every value of every reading (a lot of lines)
verbose = no
#

