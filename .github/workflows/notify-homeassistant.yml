name: Notify Home Assistant on Release

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Reload app store to check for updates
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.HA_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://ha.glebeha.uk/api/hassio/store/reload
      
      - name: Wait for store reload
        run: sleep 5
      
      - name: Update eSolarService addon
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.HA_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://ha.glebeha.uk/api/hassio/addons/62b0af83_esolarservice/update
