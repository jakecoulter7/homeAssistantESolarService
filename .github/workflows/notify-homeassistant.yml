name: Notify Home Assistant on Release

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Home Assistant Addon Repositories
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.HA_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://ha.glebeha.uk/api/hassio/addon_store/reload
      
      - name: Wait for refresh
        run: sleep 3
      
      - name: Check for addon updates
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.HA_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://ha.glebeha.uk/api/hassio/update_check
      
      - name: Wait before update
        run: sleep 2
      
      - name: Update eSolarService addon
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.HA_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://ha.glebeha.uk/api/hassio/addons/62b0af83_esolarservice/update
