name: Notify Home Assistant on Release

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Home Assistant update webhook
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            https://ha.glebeha.uk/api/webhook/${{ secrets.HA_WEBHOOK_ID }} \
            -d '{"action":"update_esolarservice"}'
        continue-on-error: true
